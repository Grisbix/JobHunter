name: installer

# Builds JobHunterSetup.exe (standalone application, no Python on the machine) and
# attaches it to the release. Runs on each published release, or by hand (Actions →
# installer → Run workflow) or on a PR that touches the packaging: the installer
# is then an artifact of the run.
# Two jobs: the build only reads the repository; only the publication, and
# only for a release, gets write permission.
# Decision: docs/adr/0011-standalone-application.md

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/installer/**"
      - "src/jobhunter/frozen.py"
      - "src/jobhunter/playwright_node.py"
      - "src/jobhunter/launch.py"
      - "src/jobhunter/web/**"
      - "requirements.txt"
      - ".github/workflows/installer.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependances
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Application et installateur
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/installer/build.py
      # Microsoft Store package (tools/installer/msix.py): unsigned, Partner Center
      # signs it. makeappx checks the manifest against its schema while packing.
      # Not blocking until a first package passes on CI (makeappx 0x8007007b came from
      # python-docx's `_rels` folders, left out since 3.44.0): the installer, which users
      # get, must not wait for the Store one.
      - name: Paquet MSIX
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          MSIX_NOM: ${{ vars.MSIX_NOM }}
          MSIX_EDITEUR: ${{ vars.MSIX_EDITEUR }}
          MSIX_EDITEUR_NOM: ${{ vars.MSIX_EDITEUR_NOM }}
        run: |
          python -m pip install "pillow>=10,<13"
          python tools/installer/msix.py
      - name: Installation silencieuse et premier lancement
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\JobHunterInstall"
          Start-Process dist\JobHunterSetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dest" -Wait
          $env:JOBHUNTER_RACINE = "$env:RUNNER_TEMP\JobHunterDonnees"
          & "$dest\jobhunter-cli.exe" --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$env:JOBHUNTER_RACINE\profile\example_finance_esg.json")) { exit 1 }
      # F4 completion criterion: on a Windows without Python, the application opens, collects
      # (system browser, merge of a fictitious scan), writes an application file and updates
      # itself. Python is removed from PATH: only the embedded Python can answer.
      - name: Sans Python - navigateur, collecte, dossier, mise à jour
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '(?i)python' }) -join ';'
          # (the Microsoft Store alias, in WindowsApps, is not a Python)
          $reste = Get-Command python -All -ErrorAction SilentlyContinue | Where-Object { $_.Source -notmatch 'WindowsApps' }
          if ($reste) { Write-Error "python encore sur le PATH : $($reste.Source)"; exit 1 }
          $dest = "$env:RUNNER_TEMP\JobHunterInstall"
          $env:JOBHUNTER_RACINE = "$env:RUNNER_TEMP\JobHunterEssai"
          $env:ESSAI_SETUP = (Resolve-Path dist\JobHunterSetup.exe).Path
          $env:ESSAI_SORTIE = "$env:RUNNER_TEMP\maj_setup.txt"
          # node.exe is not in the installer (3.62): the zip just built, not the release's
          $env:JOBHUNTER_NODE_ZIP = (Resolve-Path dist\playwright-node-win64.zip).Path
          $env:PYTHONIOENCODING = "utf-8"
          & "$dest\jobhunter-cli.exe" -c "exec(open(r'tools/installer/check_installed.py', encoding='utf-8').read())"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Sans Python - la fenêtre s'ouvre et reste ouverte
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '(?i)python' }) -join ';'
          $env:JOBHUNTER_RACINE = "$env:RUNNER_TEMP\JobHunterEssai"
          $env:JOBHUNTER_SANS_FOND = "1"   # no background work: nothing goes out on the web
          $env:JOBHUNTER_EXIGER_WEB = "1"  # the web window (3.29), never the classic one instead
          $p = Start-Process "$env:RUNNER_TEMP\JobHunterInstall\JobHunter.exe" -PassThru
          $titre = ""
          for ($i = 0; $i -lt 60 -and -not $titre; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Write-Error "l'application s'est fermée (code $($p.ExitCode))"; exit 1 }
            $p.Refresh(); $titre = $p.MainWindowTitle
          }
          if (-not $titre) { Write-Error "aucune fenêtre en 2 minutes"; exit 1 }
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "fermée après ouverture"; exit 1 }
          Write-Output "fenêtre : $titre"
          Stop-Process -Id $p.Id -Force
      - name: Mise à jour par-dessus l'installation, données gardées
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\JobHunterInstall"
          $setup = Get-Content "$env:RUNNER_TEMP\maj_setup.txt" -Raw
          Start-Process $setup.Trim() -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dest" -Wait
          $env:JOBHUNTER_RACINE = "$env:RUNNER_TEMP\JobHunterEssai"
          & "$dest\jobhunter-cli.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($f in "profile\profile.json", "data\apply_queue.json") {
            if (-not (Test-Path "$env:JOBHUNTER_RACINE\$f")) { Write-Error "$f perdu"; exit 1 }
          }
          Write-Output "mise à jour installée, données gardées"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: JobHunterSetup
          path: dist/JobHunterSetup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: PlaywrightNode
          path: dist/playwright-node-win64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: JobHunterMsix
          path: dist/JobHunter.msix
          if-no-files-found: ignore

  publier:
    # The only job that writes: it attaches the installer already built and checked.
    if: github.event_name == 'release'
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write      # provenance attestation (Sigstore)
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: JobHunterSetup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: PlaywrightNode
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true  # no package when the MSIX step failed
        with:
          name: JobHunterMsix
      # Verifiable proof that the executable comes from THIS repository and THIS workflow:
      #   gh attestation verify JobHunterSetup.exe --repo Grisbix/JobHunter
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: JobHunterSetup.exe
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        if: hashFiles('JobHunter.msix') != ''
        with:
          subject-path: JobHunter.msix
      - name: Empreinte SHA-256
        run: sha256sum JobHunterSetup.exe > JobHunterSetup.exe.sha256
      - name: Attacher a la release
        env:
          GH_TOKEN: ${{ github.token }}
          # Never a ${{ }} expression in the script: the name comes from the environment.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The application downloads the zip from this release (jobhunter.playwright_node).
          fichiers=(JobHunterSetup.exe JobHunterSetup.exe.sha256 playwright-node-win64.zip)
          if [ -f JobHunter.msix ]; then fichiers+=(JobHunter.msix); fi
          gh release upload "$TAG" "${fichiers[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  store:
    # Sends the release's MSIX to the Microsoft Store as a new submission (ADR 0015).
    # Off until the author sets the repository variable MSSTORE_PRODUCT_ID (the Store
    # ID, 9N…) and the four secrets of the Partner Center Entra application: the
    # first submission is made by hand, Microsoft's API only updates a live app.
    # The Store still certifies each update before users get it.
    if: github.event_name == 'release' && vars.MSSTORE_PRODUCT_ID != ''
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: JobHunterMsix
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0  # v1.4
        with:
          version: v0.4.3
      - name: Envoi au Store
        shell: pwsh
        env:
          # Never a ${{ }} expression in the script: the values come from the environment.
          TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER: ${{ secrets.SELLER_ID }}
          CLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          PRODUIT: ${{ vars.MSSTORE_PRODUCT_ID }}
        run: |
          msstore reconfigure --tenantId $env:TENANT --sellerId $env:SELLER --clientId $env:CLIENT --clientSecret $env:SECRET
          if ($LASTEXITCODE -ne 0) { exit 1 }
          msstore publish (Resolve-Path JobHunter.msix).Path -id $env:PRODUIT
          if ($LASTEXITCODE -ne 0) { exit 1 }
