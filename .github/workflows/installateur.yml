name: installateur

# Construit JobHunterSetup.exe (application autonome, sans Python sur la machine) et
# l'attache à la release. Lancé à chaque release publiée, ou à la main (Actions →
# installateur → Run workflow) ou par une PR qui touche l'empaquetage : l'installateur
# est alors un artefact du run.
# Deux jobs : la construction ne fait que lire le dépôt ; seule la publication, et
# seulement pour une release, reçoit le droit d'écrire.
# Décision : docs/adr/0011-application-autonome.md

on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - "outils/installateur/**"
      - "src/jobhunter/gele.py"
      - ".github/workflows/installateur.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependances
        run: python -m pip install -r requirements.txt "pyinstaller>=6.10,<7"
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Application et installateur
        env:
          PYTHONIOENCODING: utf-8
        run: python outils/installateur/construire.py
      - name: Installation silencieuse et premier lancement
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\JobHunterInstall"
          Start-Process dist\JobHunterSetup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dest" -Wait
          $env:JOBHUNTER_RACINE = "$env:RUNNER_TEMP\JobHunterDonnees"
          & "$dest\jobhunter-cli.exe" --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$env:JOBHUNTER_RACINE\profil\exemple_finance_esg.json")) { exit 1 }
      # Critère de fin de F4 : sur un Windows sans Python, l'application s'ouvre, collecte
      # (navigateur du système, fusion d'un scan fictif), écrit un dossier et se met à
      # jour. Python est retiré du PATH : seul le Python embarqué peut répondre.
      - name: Sans Python - navigateur, collecte, dossier, mise à jour
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '(?i)python' }) -join ';'
          # (l'alias du Microsoft Store, dans WindowsApps, n'est pas un Python)
          $reste = Get-Command python -All -ErrorAction SilentlyContinue | Where-Object { $_.Source -notmatch 'WindowsApps' }
          if ($reste) { Write-Error "python encore sur le PATH : $($reste.Source)"; exit 1 }
          $dest = "$env:RUNNER_TEMP\JobHunterInstall"
          $env:JOBHUNTER_RACINE = "$env:RUNNER_TEMP\JobHunterEssai"
          $env:ESSAI_SETUP = (Resolve-Path dist\JobHunterSetup.exe).Path
          $env:ESSAI_SORTIE = "$env:RUNNER_TEMP\maj_setup.txt"
          $env:PYTHONIOENCODING = "utf-8"
          & "$dest\jobhunter-cli.exe" -c "exec(open(r'outils/installateur/essai_installe.py', encoding='utf-8').read())"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Sans Python - la fenêtre s'ouvre et reste ouverte
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '(?i)python' }) -join ';'
          $env:JOBHUNTER_RACINE = "$env:RUNNER_TEMP\JobHunterEssai"
          $env:JOBHUNTER_SANS_FOND = "1"   # aucun travail de fond : rien ne sort sur le web
          $p = Start-Process "$env:RUNNER_TEMP\JobHunterInstall\JobHunter.exe" -PassThru
          $titre = ""
          for ($i = 0; $i -lt 60 -and -not $titre; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Write-Error "l'application s'est fermée (code $($p.ExitCode))"; exit 1 }
            $p.Refresh(); $titre = $p.MainWindowTitle
          }
          if (-not $titre) { Write-Error "aucune fenêtre en 2 minutes"; exit 1 }
          Start-Sleep -Seconds 10
          if ($p.HasExited) { Write-Error "fermée après ouverture"; exit 1 }
          Write-Output "fenêtre : $titre"
          Stop-Process -Id $p.Id -Force
      - name: Mise à jour par-dessus l'installation, données gardées
        shell: pwsh
        run: |
          $dest = "$env:RUNNER_TEMP\JobHunterInstall"
          $setup = Get-Content "$env:RUNNER_TEMP\maj_setup.txt" -Raw
          Start-Process $setup.Trim() -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$dest" -Wait
          $env:JOBHUNTER_RACINE = "$env:RUNNER_TEMP\JobHunterEssai"
          & "$dest\jobhunter-cli.exe" --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($f in "profil\profil.json", "Scripts\apply_queue.json") {
            if (-not (Test-Path "$env:JOBHUNTER_RACINE\$f")) { Write-Error "$f perdu"; exit 1 }
          }
          Write-Output "mise à jour installée, données gardées"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: JobHunterSetup
          path: dist/JobHunterSetup.exe
          if-no-files-found: error

  publier:
    # Seul job qui écrit : il attache l'installateur déjà construit et contrôlé.
    if: github.event_name == 'release'
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write      # attestation de provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: JobHunterSetup
      # Preuve vérifiable que l'exécutable sort de CE dépôt et de CE workflow :
      #   gh attestation verify JobHunterSetup.exe --repo Grisbix/JobHunter
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: JobHunterSetup.exe
      - name: Empreinte SHA-256
        run: sha256sum JobHunterSetup.exe > JobHunterSetup.exe.sha256
      - name: Attacher a la release
        env:
          GH_TOKEN: ${{ github.token }}
          # Jamais d'expression ${{ }} dans le script : le nom vient de l'environnement.
          TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$TAG" JobHunterSetup.exe JobHunterSetup.exe.sha256
          --clobber --repo "$GITHUB_REPOSITORY"
