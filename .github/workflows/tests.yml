name: tests

# On each push: code quality (ruff, version), non-regression bench, and the
# network-free test suites through pytest. Everything runs on the example profile
# (_profil_test.py, the bench's fictitious offers): no personal data is needed.
on:
  push:
  pull_request:

# The workflow token only reads the repository: no step writes.
permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Outils
        run: python -m pip install "ruff>=0.15,<0.16" "mypy>=1.15,<3" uv
      - name: Lint
        run: ruff check --output-format github .
      - name: Format
        run: ruff format --check .
      - name: Types (mypy, strict sur le socle)
        run: mypy
      - name: Le paquet se construit (wheel)
        run: uv build --wheel
      - name: uv.lock a jour avec pyproject.toml
        run: uv lock --check
      - name: VERSION = pyproject.toml
        run: python outils/verifie_version.py

  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependances
        run: |
          python -m pip install -r requirements.txt "pytest>=9,<10" "pytest-cov>=6,<8"
          python -m playwright install chromium
      - name: Banc de non-regression
        env:
          PYTHONIOENCODING: utf-8
        run: python outils/banc.py comparer outils/banc_reference.json
      - name: Tests et couverture (pytest)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q --cov --cov-report=term

  unix:
    # The macOS/Linux scripts and the pure logic, outside Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      # shell: bash = "bash -eo pipefail": without pipefail, `| tail -1` returned
      # tail's exit code and a failing suite went green.
      - name: Syntaxe des scripts .sh
        shell: bash
        run: for f in *.sh; do bash -n "$f"; echo "$f ok"; done
      - name: Compilation de tous les programmes
        shell: bash
        run: python -m py_compile JobHunter.pyw $(find src -name '*.py')
      - name: Dependances
        run: python -m pip install -r requirements.txt "pytest>=9,<10"
      - name: Banc de non-regression (meme reference que sous Windows)
        env:
          PYTHONIOENCODING: utf-8
        run: python outils/banc.py comparer outils/banc_reference.json
      - name: Logique pure (scoring, sources, titres, contrats, mise a jour)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -k "scoring or sources or titres or contrats or mise_a_jour"
