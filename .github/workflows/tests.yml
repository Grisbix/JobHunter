name: tests

# A chaque push : qualite du code (ruff, version), banc de non-regression, et les
# 27 suites sans reseau via pytest. Tout tourne sur le profil d'exemple
# (_profil_test.py, offres fictives du banc) : aucune donnee personnelle n'est necessaire.
on:
  push:
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Outils
        run: python -m pip install "ruff>=0.15,<0.16"
      - name: Lint
        run: ruff check --output-format github .
      - name: Format
        run: ruff format --check .
      - name: VERSION = pyproject.toml
        run: python outils/verifie_version.py

  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependances
        run: |
          python -m pip install -r requirements.txt "pytest>=9,<10"
          python -m playwright install chromium
      - name: Banc de non-regression
        env:
          PYTHONIOENCODING: utf-8
        run: python outils/banc.py comparer outils/banc_reference.json
      - name: Suites sans reseau (pytest)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q

  unix:
    # Les scripts macOS/Linux et la logique pure, hors Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # shell: bash = « bash -eo pipefail » : sans pipefail, `| tail -1` rendait le
      # code de tail et une suite en echec passait au vert.
      - name: Syntaxe des scripts .sh
        shell: bash
        run: for f in *.sh; do bash -n "$f"; echo "$f ok"; done
      - name: Compilation de tous les programmes
        run: python -m py_compile JobHunter.pyw Scripts/*.py
      - name: Dependances
        run: python -m pip install -r requirements.txt "pytest>=9,<10"
      - name: Banc de non-regression (meme reference que sous Windows)
        env:
          PYTHONIOENCODING: utf-8
        run: python outils/banc.py comparer outils/banc_reference.json
      - name: Logique pure (scoring, sources, titres, contrats, mise a jour)
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest -q -k "scoring or sources or titres or contrats or mise_a_jour"
