name: tests

# Les vingt et une suites sans reseau, plus le mock de navigation, a chaque push.
# Elles tournent sur le profil d'exemple (_profil_test.py) : aucune donnee
# personnelle n'est necessaire.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependances
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium
      - name: Banc de non-regression
        env:
          PYTHONIOENCODING: utf-8
        run: python outils/banc.py comparer outils/banc_reference.json
      - name: Suites sans reseau
        working-directory: Scripts
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $suites = @(
            "test_sources", "test_patterns", "test_scoring", "test_titres", "test_appel",
            "test_lettre", "test_contrats", "test_queue_io", "test_liens", "test_suivi",
            "test_zones", "test_audit_dispo", "test_cv_auto", "test_agregateurs",
            "test_glassdoor_refus", "test_rejets_tri", "test_tri_file", "test_site_final",
            "test_metriques_hebdo", "test_lecteurs_ats", "test_web_nav_mock",
            "test_mise_a_jour"
          )
          $echecs = @()
          foreach ($s in $suites) {
            python "$s.py" | Select-Object -Last 1
            if ($LASTEXITCODE -ne 0) { $echecs += $s }
          }
          if ($echecs.Count) { Write-Error "Suites en echec : $($echecs -join ', ')"; exit 1 }

  unix:
    # Les scripts macOS/Linux et la logique pure, hors Windows.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # shell: bash = « bash -eo pipefail » : sans pipefail, `| tail -1` rendait le
      # code de tail et une suite en echec passait au vert.
      - name: Syntaxe des scripts .sh
        shell: bash
        run: for f in *.sh; do bash -n "$f"; echo "$f ok"; done
      - name: Compilation de tous les programmes
        run: python -m py_compile JobHunter.pyw Scripts/*.py
      - name: Banc de non-regression (meme reference que sous Windows)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install -r requirements.txt
          python outils/banc.py comparer outils/banc_reference.json
      - name: Logique pure (scoring, sources, titres, contrats, mise a jour)
        working-directory: Scripts
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install -r ../requirements.txt
          for s in test_scoring test_sources test_titres test_contrats test_mise_a_jour; do python "$s.py" | tail -1; done
