name: dependances

# Une PR qui ajoute ou monte une dépendance avec une vulnérabilité connue (gravité
# modérée ou plus) ou une licence incompatible est bloquée avant la fusion.
on:
  pull_request:

permissions:
  contents: read

jobs:
  revue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
