version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Bornes deja ouvertes jusqu'a la prochaine majeure : une PR seulement quand une
    # version en sort (customtkinter 6), pas pour remonter le plancher a chaque version.
    versioning-strategy: increase-if-necessary
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
