version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Bounds already open up to the next major: a PR only when a
    # version falls outside them (customtkinter 6), not to raise the floor at every release.
    versioning-strategy: increase-if-necessary
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
