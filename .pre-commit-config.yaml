# Checks before each commit. Install once:
#   uv sync && uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff-check
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
  - repo: local
    hooks:
      - id: pas-de-donnees-perso
        name: aucune donnée personnelle (profil, file, suivi, lettres, clés)
        language: system
        entry: python outils/donnees_perso.py
      - id: version-coherente
        name: VERSION = version de pyproject.toml
        language: system
        entry: python outils/verifie_version.py
        files: ^(VERSION|pyproject\.toml)$
        pass_filenames: false
