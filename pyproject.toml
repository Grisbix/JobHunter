[project]
name = "jobhunter"
# Doit rester egal au fichier VERSION (lu par la mise a jour) : la CI le verifie.
version = "2.10.0"
description = "Recherche d'emploi locale : collecte, notation, CV et lettre par offre, candidature semi-automatique."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Memes bornes que requirements.txt, que gardent installer.bat / installer.sh.
dependencies = [
    "customtkinter>=5.2.2,<7",
    "playwright>=1.60,<2",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1.5,<4",
    "PyMuPDF>=1.27,<2",
    "httpx>=0.28.1,<0.29",
    "requests>=2.34,<3",
]

# `jobhunter <commande>` une fois le paquet installe (phase 6) ; avant : python -m jobhunter.
[project.scripts]
jobhunter = "jobhunter.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.15,<0.16",
    "pytest>=9,<10",
    "pre-commit>=4,<5",
    "pytest-cov>=6,<8",
    "mypy>=1.15,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# Le paquet installable est src/jobhunter, programmes compris (2.0). Les donnees
# (Scripts/, profil/, CV, lettres) restent dans le dossier de l'utilisateur : le paquet
# installe le trouve par JOBHUNTER_RACINE ou en remontant depuis le dossier courant.
[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

[tool.uv]
package = true

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.pyw"]
src = ["src", "outils"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "D"]
# Regles suspendues, A RESORBER (comptes au 2026-10-17). Chacune demande un
# travail a la main ou depend du decoupage en paquet (phase 3) ; on ne les
# ajoute pas en vrac a `ignore` sans compte ni raison.
ignore = [
    "E402",   # 43 — imports apres du code (console UTF-8, profil d'exemple en tete)
    "E501",   # lignes longues restantes : chaines et commentaires que le formateur ne coupe pas
    "E741",   # 35 — variables nommees l / O / I
    "UP031",  # 35 — formatage « % » a convertir en f-strings
    "B007",   # 12 — variable de boucle inutilisee
    "B905",   # 4 — zip() sans strict=
    "B904",   # 3 — raise sans « from » dans un except
    "B005",   # 2 — strip() avec plusieurs caracteres
    "B023",   # 2 — fonction qui capture une variable de boucle
    "E731",   # 4 — lambda affectee a un nom
    "UP035",  # 1 — import deprecie
    "F841",   # 11 — variable affectee jamais lue (a relire une par une)
]

# Docstrings au format Google (phase 8) : exigees sur toute l'API publique du paquet.
# Exemptes : les programmes (jobhunter.programmes, des lignes de commande) et la
# fenetre (jobhunter.app, des mixins d'interface), qui ne sont pas des bibliotheques.
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"!src/jobhunter/**/*.py" = ["D"]
"src/jobhunter/programmes/*" = ["D"]
"src/jobhunter/app/*" = ["D"]

[tool.ruff.lint.isort]
# _profil_test doit rester le PREMIER import d'un test : il fixe le profil
# d'exemple avant que le moteur ne lise le profil au chargement.
section-order = ["future", "profil", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
profil = ["_profil_test"]

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "donnees_reelles: lit les donnees reelles d'un utilisateur (suivi, file) ; a lancer expres",
]
addopts = "-m 'not donnees_reelles'"

# ── couverture ───────────────────────────────────────────────────────────────
# ── mypy (phase 5 du plan) ───────────────────────────────────────────────────
# Tout le paquet est verifie ; le SOCLE l'est en mode strict. Un module rejoint la
# liste stricte quand il est entierement annote — jamais de retour en arriere.
[tool.mypy]
python_version = "3.12"
files = ["src/jobhunter"]
ignore_missing_imports = true
warn_unused_ignores = true
# Les programmes (anciens Scripts/*.py, entres dans le paquet en 2.0) sont verifies en
# mode normal depuis le 2026-10-19 (82 erreurs resorbees) ; leurs fonctions restent pour
# la plupart non annotees, d'ou l'exclusion ci-dessous des appels non types.
untyped_calls_exclude = ["jobhunter.programmes"]

[[tool.mypy.overrides]]
module = [
    "jobhunter.stockage.*",
    "jobhunter.profil",
    "jobhunter.reseau",
    "jobhunter.racine",
    "jobhunter.texte",
    "jobhunter.liens",
    "jobhunter.types",
    "jobhunter.scoring.*",
    "jobhunter.chemins",
    "jobhunter._facade",
    "jobhunter.paresseux",
    "jobhunter.journal",
    "jobhunter.cli",
    "jobhunter.accueil",
    "jobhunter.mise_a_jour",
    "jobhunter.documents.*",
    "jobhunter.navigation.*",
    "jobhunter.sources.*",
    "jobhunter.app.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.coverage.run]
source = ["src/jobhunter"]
omit = ["*/test_*.py", "*/_profil_test.py"]
# Les suites historiques tournent en sous-processus : sans ceci, elles ne comptent pas.
patch = ["subprocess"]

[tool.coverage.report]
skip_empty = true
# Point de depart mesure le 2026-10-18 : 31 % du moteur (fichiers de test exclus). Le seuil ne descend jamais ; il monte
# a mesure que les suites sont converties et que les modules a 0 % sont couverts.
fail_under = 30

