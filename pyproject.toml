[project]
name = "jobhunter"
# Must stay equal to the VERSION file (read by the update): CI checks it.
version = "3.33.0"
description = "Recherche d'emploi locale : collecte, notation, CV et lettre par offre, candidature semi-automatique."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Same bounds as requirements.txt, which install.bat / install.sh keep.
dependencies = [
    "customtkinter>=5.2.2,<7",
    "pywebview>=6.2,<7",
    "tkinterdnd2>=0.4.3,<1",
    "playwright>=1.60,<2",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1.5,<4",
    "PyMuPDF>=1.27,<2",
    "httpx>=0.28.1,<0.29",
    "requests>=2.34,<3",
    # The CA bundle httpx and requests use. 2026.10.19 removes emSign roots whose
    # intermediate keys were compromised (GHSA, critical): a floor, not a pin.
    "certifi>=2026.10.19",
]

# `jobhunter <command>` once the package is installed (phase 6); before: python -m jobhunter.
[project.scripts]
jobhunter = "jobhunter.cli:main"

# Reading statuses in Gmail (jobhunter statuts-mail --gmail), optional: the .mbox / .eml
# export does not need it.
[project.optional-dependencies]
gmail = ["google-auth-oauthlib>=1.2,<2"]
# The application's window has been the web interface since 3.29: pywebview is a
# dependency; this extra stays so that `jobhunter[web]` still installs.
web = ["pywebview>=6.2,<7"]

[dependency-groups]
dev = [
    "ruff>=0.15,<0.18",
    "pytest>=9,<10",
    "pre-commit>=4,<5",
    "pytest-cov>=6,<8",
    "mypy>=1.15,<3",
    "hypothesis>=6.100,<7",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# The installable package is src/jobhunter, programs included (2.0). The data
# (Scripts/, profil/, CVs, letters) stay in the user's folder: the installed
# package finds it through JOBHUNTER_RACINE or by going up from the current folder.
[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter"]

[tool.uv]
package = true

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.pyw"]
src = ["src", "outils"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "D"]
# Suspended rules, TO BE CLEARED (counts as of 2026-10-17). Each one needs
# manual work or depends on the package split (phase 3); they are not
# added in bulk to `ignore` without a count or a reason.
ignore = [
    "E402",   # 43 — imports after code (UTF-8 console, example profile first)
    "E501",   # remaining long lines: strings and comments the formatter does not split
    "E741",   # 35 — variables named l / O / I
    "UP031",  # 35 — "%" formatting to convert to f-strings
    "B007",   # 12 — unused loop variable
    "B905",   # 4 — zip() without strict=
    "B904",   # 3 — raise without "from" inside an except
    "B005",   # 2 — strip() with several characters
    "B023",   # 2 — function that captures a loop variable
    "E731",   # 4 — lambda assigned to a name
    "UP035",  # 1 — deprecated import
    "F841",   # 11 — variable assigned but never read (to review one by one)
]

# Google-style docstrings (phase 8): required on the package's whole public API.
# Exempt: the programs (jobhunter.programs, command lines) and the
# window (jobhunter.app, interface mixins), which are not libraries.
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"!src/jobhunter/**/*.py" = ["D"]
"src/jobhunter/programs/*" = ["D"]
"src/jobhunter/app/*" = ["D"]

[tool.ruff.lint.isort]
# _profil_test must stay a test's FIRST import: it sets the example
# profile before the engine reads the profile at load time.
section-order = ["future", "profil", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
profil = ["_profil_test"]

# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "donnees_reelles: lit les donnees reelles d'un utilisateur (suivi, file) ; a lancer expres",
]
addopts = "-m 'not donnees_reelles'"

# ── coverage ───────────────────────────────────────────────────────────────
# ── mypy (phase 5 of the plan) ───────────────────────────────────────────────────
# The whole package is checked; the CORE in strict mode. A module joins the
# strict list when it is fully annotated — never going back.
[tool.mypy]
python_version = "3.12"
files = ["src/jobhunter"]
ignore_missing_imports = true
warn_unused_ignores = true
# The programs (formerly Scripts/*.py, moved into the package in 2.0) are checked in
# normal mode since 2026-10-19 (82 errors cleared); most of their functions remain
# unannotated, hence the exclusion below of untyped calls.
untyped_calls_exclude = ["jobhunter.programs", "pymupdf"]  # pymupdf: partly typed

[[tool.mypy.overrides]]
module = [
    "jobhunter.storage.*",
    "jobhunter.profile",
    "jobhunter.network",
    "jobhunter.root",
    "jobhunter.text",
    "jobhunter.links",
    "jobhunter.types",
    "jobhunter.scoring.*",
    "jobhunter.paths",
    "jobhunter._facade",
    "jobhunter.lazy",
    "jobhunter.log",
    "jobhunter.cli",
    "jobhunter.welcome",
    "jobhunter.mise_a_jour",
    "jobhunter.documents.*",
    "jobhunter.navigation.*",
    "jobhunter.sources.*",
    "jobhunter.app.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
check_untyped_defs = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[tool.coverage.run]
source = ["src/jobhunter"]
omit = ["*/test_*.py", "*/_profil_test.py"]
# The historical suites run in subprocesses: without this, they do not count.
patch = ["subprocess"]

[tool.coverage.report]
skip_empty = true
# Starting point measured on 2026-10-18: 31 % of the engine (test files excluded). The threshold never goes down; it rises
# as the suites are converted and the modules at 0 % get covered.
fail_under = 30

